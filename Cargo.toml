[package]
name = "tpt-app-cutlist-optimizer"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [".", "solver", "desktop"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pro edition (paid desktop build): enables the solver's improvement pass
# (randomized restarts + local search), multi-stock/multi-material input,
# the saved stock-set library, and print export. The free WASM build
# compiles without it — default features are free, `--features pro` is Pro.
pro = [
    "tpt-cutlist-solver/improvement",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
tpt-appfront-core = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-core" }
tpt-appfront-dom = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-dom" }
tpt-cutlist-solver = { path = "solver" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Pinned to the installed wasm-bindgen CLI version — the CLI rejects wasm
# built against a different schema version. Bump both together.
wasm-bindgen = "=0.2.126"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlHeadElement",
    "HtmlAnchorElement",
    "EventTarget",
    "KeyboardEvent",
    # Shareable permalinks: read location.hash, replace it in place.
    "Location",
    "History",
    # Copy share link: async Clipboard API with an execCommand fallback.
    "Navigator",
    "Clipboard",
    # CSV / project-file import: the hidden file picker + FileReader.
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "Event",
    # execCommand fallback for copy-to-clipboard in older webviews.
    "HtmlDocument",
] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The desktop shell is a native binary; keep its codegen normal even in the
# same workspace (the `release` profile above applies to the wasm lib build).
[profile.release.package.tpt-cutlist-desktop]
opt-level = 3

